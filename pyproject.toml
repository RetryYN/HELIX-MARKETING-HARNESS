[project]
name = "helix-marketing-harness"
version = "0.0.1"
description = "HELIX-MARKETING-HARNESS — 証跡と機械ゲートで品質を守るマーケティングハーネス（実装正本 = src/helix）"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/helix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]

[tool.coverage.run]
source = ["src/helix"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # pytest の assert

[tool.ruff.lint.per-file-ignores]
# validator/hooks は独立のゲートスクリプト（長い日本語メッセージ・遅延 import・awk 呼出しを許容）
"scripts/*" = ["E402", "E501", "F401", "B007", "S603", "S607"]
# ゲート実装は長い日本語メッセージを持つ（1 ゲート 1 行の可読性を優先）
"tools/*" = ["E402", "E501"]
"tests/gates/*" = ["E501", "S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["helix"]

[tool.importlinter]
root_package = "helix"

[[tool.importlinter.contracts]]
name = "単方向依存: kernel → gates → db（基盤）。逆流禁止（基本設計 §1）"
type = "layers"
layers = ["helix.kernel", "helix.gates", "helix.db"]
