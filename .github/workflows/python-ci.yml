name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint / type / imports / pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # skip/coverage ラチェットの比較元（親コミットの baseline・coverage-floor）に必要
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Sync dependencies (frozen lock)
        run: uv sync --frozen --group dev
      - name: ruff
        run: uv run ruff check .
      - name: mypy (strict)
        run: uv run mypy
      - name: import-linter (単方向依存 kernel→gates→db)
        run: uv run lint-imports
      - name: coverage 下限を解決 (S0.1 着手を自動検出して 80% へ引き上げる)
        id: cov
        run: echo "floor=$(python3 tools/coverage_floor.py)" >> "$GITHUB_OUTPUT"
      - name: pytest + coverage (ゲート単体/mutation・DDL・STC-I・migration 試験)
        run: uv run pytest --cov=helix --cov-report=term --cov-fail-under=${{ steps.cov.outputs.floor }}
      - name: skip 件数ラチェット (green の誤読防止 — tests/skip-budget.json)
        run: python3 scripts/check_skip_budget.py

  shellcheck:
    name: shellcheck (hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/hooks/*.sh

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
